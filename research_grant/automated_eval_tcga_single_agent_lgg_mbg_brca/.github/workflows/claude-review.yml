name: Claude Auto Review

# Portfolio-wide code-quality review, managed centrally from
# Robertjam954/project_planning_tracking_code_review. Requires an ANTHROPIC_API_KEY
# secret on this repo.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  review:
    # Skip drafts to save review spend; they get reviewed on "ready_for_review".
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            This repo is a controlled experiment comparing agent architectures. Read
            CLAUDE.md and docs/adr/README.md first, then follow the review order in
            .claude/agents/code-reviewer.md.

            Review experimental validity FIRST - it is the failure mode that does not
            show up in the results:
            - Did this change shared infrastructure (retrieval config, tool registry,
              task set, prompts)? If docs/experiment_metadata.md says status: frozen,
              the PR needs an ADR and must state the re-run scope.
            - Was a frozen prompt edited in place instead of creating a new prompt_id?
              That is forbidden by ADR-0006.
            - Is there a prompt literal in code instead of a registry lookup?
            - Does the change give one arm an advantage the other lacks?
            - Does new agent behavior write through the data layer, so every reported
              number traces to run-store rows?

            Then review: silent failures (a swallowed tool error makes a measured
            failure invisible), data and privacy (nothing under data/ staged, no
            GENIE/IMPACT patient-level data, no secrets), data-analysis hygiene, and
            ordinary code quality.

            Note: The PR branch is already checked out in the current working directory.
            Provide detailed feedback using inline comments for specific issues.

          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
